# Local development dependencies. Azure Cache for Redis stands in for this in
# every deployed environment -- see README "Session storage per environment".
#
# Run from the app root:
#   npm run docker:up      build and start the app plus Redis
#   npm run redis:up       start only Redis (for `npm run start:dev` on the host)
#   npm run docker:down    stop everything, keeping sessions
#
# The Cosmos DB emulator lives in docker-compose.cosmos.yml, as its own project
# with its own lifecycle -- see README.

# Pinned explicitly. Compose otherwise derives the project name from the
# directory holding this file, which since the move to infra/ would name every
# container and volume "infra".
#
# No service sets container_name: that name is global across every Compose
# project on the machine, so a container left over from an older project name
# blocks this one from starting with "name is already in use". Letting Compose
# derive it (b2c-local-redis-1) keeps the names scoped to this project. Address
# services by their service name -- `docker compose exec redis ...` -- not by
# container name.
name: b2c-local

services:
  app:
    build:
      # The build context is the app root, so package.json, src, views and
      # public are all in scope; .dockerignore lives there because Docker only
      # reads it from the context root.
      context: ..
      dockerfile: infra/Dockerfile
    # Reap zombies and forward signals, so Ctrl-C and `docker stop` reach Node.
    init: true
    env_file:
      - path: ../.env
        required: false
    environment:
      PORT: '3000'
      # Overrides whatever .env says: inside the Compose network Redis answers
      # to its service name, and localhost would be the app's own container.
      REDIS_URL: redis://redis:6379
      # Same reasoning, and the reason the demo links fail without it: from in
      # here localhost:3001 is this container, not the machine. The API is a
      # separate Compose project, so both attach to the shared b2c-shared
      # network below and address each other by service name.
      # Override with a shell variable when the API is somewhere else, e.g.
      # DEMO_API_URL=http://host.docker.internal:3001/hello npm run docker:up
      DEMO_API_URL: ${DEMO_API_URL:-http://api:3001/hello}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      # The app connects to Redis during bootstrap and fails fast if it cannot,
      # so wait for the healthcheck rather than racing it.
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    # Redis 8 absorbed Redis Stack: JSON, search, time series and probabilistic
    # types are built into core, so redis-stack-server is no longer needed
    # (its maintenance releases ended in December 2025).
    image: redis:8-alpine
    # Bound to loopback only: an unauthenticated Redis reachable from the
    # network would let anyone on it read and forge session data.
    ports:
      - '127.0.0.1:6379:6379'
    # Persist to disk so sessions survive `docker compose restart`, which is
    # how Azure Cache for Redis behaves when the app restarts.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  # Declared external, and created by the npm scripts, rather than letting each
  # project create it. Two Compose projects that both *declare* the same network
  # fight over its ownership labels, and the second one up fails. External means
  # neither owns it, so order does not matter and neither `down` destroys it.
  #
  #   docker network create b2c-shared     # once, if running compose by hand
  default:
    name: b2c-shared
    external: true

volumes:
  redis-data:
