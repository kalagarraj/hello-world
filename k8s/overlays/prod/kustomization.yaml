apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: b2c
resources:
  - ../../base

images:
  - { name: b2c-web, newName: ghcr.io/OWNER/b2c-web, newTag: "1.0.0" }
  - { name: b2c-api, newName: ghcr.io/OWNER/b2c-api, newTag: "1.0.0" }

patches:
  - path: web-patch.yaml
  - path: api-patch.yaml
  # Production uses Azure Cache for Redis, so the in-cluster one is removed
  # entirely rather than left running and ignored.
  - path: drop-redis.yaml
    target: { kind: Deployment, name: redis }
  - path: drop-redis-service.yaml
    target: { kind: Service, name: redis }

# The tenant and user flow live in base/config.yaml -- one place to edit.
# Uncomment only if THIS environment uses a different tenant or policy;
# duplicating the same values here just creates a second thing to forget.
# configMapGenerator:
#   - name: b2c-config
#     behavior: merge
#     literals:
#       - B2C_TENANT_NAME=contoso-dev
#       - B2C_POLICY_NAME=B2C_1_signupsignin
