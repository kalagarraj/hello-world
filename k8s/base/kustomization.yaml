apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: b2c

resources:
  - namespace.yaml
  - config.yaml
  - web.yaml
  - api.yaml
  - redis.yaml
  - prometheus.yaml
  - grafana.yaml
  - ingress.yaml

# Kustomize will not read files outside its own directory, so this is a copy of
# observability/grafana/dashboards/b2c-api-calls.json rather than a reference to
# it. ./k8s/sync-dashboard.sh refreshes it; --check fails when they differ.
configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/b2c-api-calls.json
    # Same component label as the rest of Grafana, so `kubectl apply -l` picks
    # the dashboard up together with the Deployment that mounts it.
    options:
      labels:
        app.kubernetes.io/component: dashboard

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: b2c
