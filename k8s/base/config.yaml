# Non-secret configuration shared by both apps. Overlays patch the values that
# differ per environment; anything sensitive lives in the Secret instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: b2c-config
data:
  B2C_TENANT_NAME: contoso
  B2C_POLICY_NAME: B2C_1_signupsignin
  B2C_CLIENT_ID: "00000000-0000-0000-0000-000000000000"
  B2C_SCOPE: openid profile email offline_access
