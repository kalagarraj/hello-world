# A template, NOT applied by kustomization.yaml -- committing real values is
# how secrets leak. Create the Secret out of band:
#
#   kubectl -n b2c create secret generic b2c-secrets \
#     --from-literal=B2C_CLIENT_SECRET='...' \
#     --from-literal=SESSION_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=REDIS_URL='rediss://:<key>@<name>.redis.cache.windows.net:6380'
#
# In Azure, prefer the Key Vault CSI driver or External Secrets Operator so the
# cluster holds a reference rather than the value.
apiVersion: v1
kind: Secret
metadata:
  name: b2c-secrets
type: Opaque
stringData:
  B2C_CLIENT_SECRET: replace-me
  SESSION_SECRET: replace-me
  # Only in environments using Azure Cache for Redis. The dev overlay runs
  # Redis in-cluster and sets REDIS_URL directly instead.
  REDIS_URL: ""
