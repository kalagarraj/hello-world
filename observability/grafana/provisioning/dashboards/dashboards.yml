apiVersion: 1

providers:
  - name: b2c
    orgId: 1
    folder: B2C
    type: file
    disableDeletion: false
    # Edits made in the UI are overwritten from disk, so the file stays the
    # source of truth. Use "Export -> Save to file" to keep a change.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
