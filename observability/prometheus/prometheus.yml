global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: b2c-api
    metrics_path: /metrics
    static_configs:
      # The API's service name on the shared b2c-shared network. This works on
      # every platform and does not depend on how the API publishes ports.
      #
      # If you run the API on your machine instead of in Docker, swap this for
      # 'host.docker.internal:9464' -- the extra_hosts entry in the Compose file
      # makes that resolvable on Linux too.
      - targets: ['api:9464']
        labels:
          service: b2c-api
