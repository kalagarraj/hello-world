# Prometheus + Grafana for the NestJS API's call metrics.
#
#   docker compose -f observability/docker-compose.yml up -d
#   Grafana      http://localhost:3002   (anonymous, viewer)
#   Prometheus   http://localhost:9090
#
# The API must be running and attached to the b2c-shared network, which
# `npm run docker:up` in either app creates. By hand:
#
#   docker network create b2c-shared
#
# Own project name so this stack starts and stops independently of the others.
name: b2c-observability

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # Lets the scrape config reach a metrics port on the host on Linux, where
    # host.docker.internal is not resolvable by default.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    ports:
      - '127.0.0.1:3002:3000'
    environment:
      # Local convenience only: browse without an account, read-only.
      # Remove all of these before exposing this anywhere.
      #
      # Grafana still shows a "Sign in" button with anonymous access on -- that
      # is normal, not a failure. Use it only if you want to edit; the
      # credentials below are the admin account.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_ORG_NAME: 'Main Org.'
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      # Consumed by the Azure Monitor datasource; unset means it simply fails
      # to authenticate rather than breaking provisioning.
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Deliberately NOT under /var/lib/grafana: that path is the grafana-data
      # volume, and a bind mount nested inside another mount is fragile -- which
      # is how the dashboard managed not to appear.
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  # Shared with the app and API stacks so Prometheus can scrape the API by its
  # service name. External so no project owns it and `down` here leaves it for
  # the others.
  default:
    name: b2c-shared
    external: true

volumes:
  prometheus-data:
  grafana-data:
