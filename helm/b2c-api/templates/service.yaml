apiVersion: v1
kind: Service
metadata:
  name: {{ include "b2c-api.fullname" . }}
  labels:
    {{- include "b2c-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "b2c-api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if .Values.metrics.enabled }}
    # Prometheus scrapes the Service rather than a pod IP, so scraping survives
    # a rescheduled or scaled API.
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
    {{- end }}
