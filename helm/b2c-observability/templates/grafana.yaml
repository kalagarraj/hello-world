{{- if .Values.grafana.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "b2c-observability.grafana.fullname" . }}
  labels:
    app.kubernetes.io/component: dashboard
    {{- include "b2c-observability.grafana.selectorLabels" . | nindent 4 }}
    {{- include "b2c-observability.commonLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "b2c-observability.grafana.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Provisioning is read at start-up only, so an edited datasource or a
        # changed dashboard needs a new pod to appear.
        checksum/provisioning: {{ include (print $.Template.BasePath "/grafana-provisioning.yaml") . | sha256sum }}
        checksum/dashboards: {{ include (print $.Template.BasePath "/grafana-dashboards.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "b2c-observability.grafana.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: {{ .Values.grafana.anonymous.enabled | quote }}
            {{- if .Values.grafana.anonymous.enabled }}
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: {{ .Values.grafana.anonymous.role | quote }}
            {{- end }}
            - name: GF_USERS_DEFAULT_THEME
              value: {{ .Values.grafana.defaultTheme | quote }}
          volumeMounts:
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /etc/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        # The two provisioning directories come from one ConfigMap, split by
        # key: Grafana reads each directory whole and would choke on a
        # dashboards provider sitting in the datasources folder.
        - name: provisioning-datasources
          configMap:
            name: {{ include "b2c-observability.grafana.fullname" . }}-provisioning
            items:
              - key: datasources.yml
                path: datasources.yml
        - name: provisioning-dashboards
          configMap:
            name: {{ include "b2c-observability.grafana.fullname" . }}-provisioning
            items:
              - key: dashboards.yml
                path: dashboards.yml
        - name: dashboards
          configMap:
            name: {{ include "b2c-observability.grafana.fullname" . }}-dashboards
        # Grafana's own SQLite lives here. Dashboards are provisioned from
        # files, so nothing is lost when the pod restarts.
        - name: data
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "b2c-observability.grafana.fullname" . }}
  labels:
    app.kubernetes.io/component: dashboard
    {{- include "b2c-observability.grafana.selectorLabels" . | nindent 4 }}
    {{- include "b2c-observability.commonLabels" . | nindent 4 }}
spec:
  type: {{ .Values.grafana.service.type }}
  selector:
    {{- include "b2c-observability.grafana.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.grafana.service.port }}
      targetPort: http
{{- end }}
