{{/*
Non-secret configuration. Everything sensitive is in the Secret next door.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "b2c-web.fullname" . }}
  labels:
    {{- include "b2c-web.labels" . | nindent 4 }}
data:
  B2C_TENANT_NAME: {{ .Values.b2c.tenantName | quote }}
  B2C_POLICY_NAME: {{ .Values.b2c.policyName | quote }}
  B2C_CLIENT_ID: {{ .Values.b2c.clientId | quote }}
  B2C_SCOPE: {{ .Values.b2c.scope | quote }}
