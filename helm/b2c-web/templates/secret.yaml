{{- if not .Values.existingSecret }}
{{/*
Skipped entirely when existingSecret is set, so a Secret you created out of
band -- or one projected from Key Vault -- is never overwritten by an upgrade.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "b2c-web.fullname" . }}
  labels:
    {{- include "b2c-web.labels" . | nindent 4 }}
type: Opaque
stringData:
  SESSION_SECRET: {{ include "b2c-web.sessionSecret" . | quote }}
  # Empty on purpose for a public client: the app then authenticates with PKCE
  # alone, which is what B2C requires of a registration it treats as public.
  B2C_CLIENT_SECRET: {{ .Values.b2c.clientSecret | quote }}
{{- end }}
